# ehsank.com — 2026 redesign (static one-page site).
# Netlify serves the pre-built static site in redesign-preview/ as-is; there is no Hugo build.
# To roll back to the previous Hugo site: `git revert` the commit that introduced this file,
# or use Netlify's dashboard to re-publish the last Hugo deploy.
[build]
  publish = "redesign-preview"
  command = "echo 'Static one-page site — no build step required.'"

# The previous site was a one-pager with no real sub-pages. Send any stray old inbound URL
# to the homepage (static files in the publish dir are still served directly and take priority).
[[redirects]]
  from = "/*"
  to = "/"
  status = 301
